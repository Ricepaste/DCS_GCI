name: Build and Release GCI Client

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 pyinstaller pytest

      - name: Run Tests
        run: |
          python -m pytest python_gci/tests/ -v

      - name: Build Executable with PyInstaller
        run: |
          cd python_gci
          pyinstaller --windowed --onedir --name GCI_Client --add-data "map_data;map_data" app.py
          powershell Copy-Item -Path "map_data" -Destination "dist/GCI_Client/map_data" -Recurse -Force
          powershell Compress-Archive -Path "dist/GCI_Client/*" -DestinationPath "dist/GCI_Client.zip" -Force

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: python_gci/dist/GCI_Client.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
